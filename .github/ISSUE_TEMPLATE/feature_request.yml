name: Feature request
description: Suggest a focused improvement to ClarifyVoice
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Product impact
      options:
        - label: This may add a runtime dependency or background process.
        - label: This changes global shortcuts, focus, clipboard, or audio behavior.
        - label: This sends new data to a provider or service.
        - label: This requires a visual or DPI validation pass on Windows.
  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
