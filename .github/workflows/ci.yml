name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock.txt

      - name: Check dependency lock
        run: pip-compile --check --strip-extras --output-file=requirements-lock.txt requirements-dev.txt

      - name: Run Ruff lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check desktop_state.py windows_hotkeys.py scripts/dependency_audit.py tests/test_repository.py

      - name: Run Ruff format check
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check scripts/dependency_audit.py tests/test_repository.py

      - name: Run targeted type checks
        if: matrix.os == 'ubuntu-latest'
        run: mypy desktop_state.py windows_hotkeys.py

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/dependency_audit.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app.py desktop_state.py windows_hotkeys.py tests

  package:
    name: Package Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock.txt

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload smoke-test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClarifyVoice-windows-${{ github.sha }}
          path: dist/ClarifyVoice.exe
          if-no-files-found: error
          retention-days: 7
