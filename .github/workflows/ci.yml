name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock_file: requirements-lock-linux.txt
          - os: windows-latest
            lock_file: requirements-lock-windows.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-linux.txt
            requirements-lock-windows.txt
            requirements-lock-runtime-windows.txt

      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file "${{ matrix.lock_file }}"

      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c "${{ matrix.lock_file }}"

      - name: Check dependency lock
        run: python scripts/check_dependency_lock.py --lock-file "${{ matrix.lock_file }}" --allow-unsafe

      - name: Check runtime dependency lock
        if: matrix.os == 'windows-latest'
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-runtime-windows.txt --requirements-file requirements.txt

      - name: Check runtime pins match build lock
        if: matrix.os == 'windows-latest'
        run: python scripts/check_runtime_lock.py

      - name: Run Ruff lint
        if: matrix.os == 'ubuntu-latest'
        run: >-
          ruff check desktop_state.py windows_hotkeys.py scripts/dependency_audit.py
          spikes/pyside6/qml_app.py spikes/pyside6/qml_bridge.py spikes/pyside6/qml_runtime.py
          spikes/pyside6/qml_settings.py spikes/pyside6/qml_audio_batch.py
          spikes/pyside6/qml_clipboard.py spikes/pyside6/qml_voice_translation.py
          spikes/pyside6/qt_shell.py tests/test_repository.py tests/test_pyside6_qml.py
          tests/test_pyside6_qml_runtime.py tests/test_pyside6_qml_audio_batch.py
          tests/test_pyside6_qml_clipboard.py tests/test_pyside6_qml_voice_translation.py
          tests/test_pyside6_qt_shell.py

      - name: Run Ruff format check
        if: matrix.os == 'ubuntu-latest'
        run: >-
          ruff format --check scripts/dependency_audit.py tests/test_repository.py
          spikes/pyside6/qml_app.py spikes/pyside6/qml_bridge.py spikes/pyside6/qml_runtime.py
          spikes/pyside6/qml_settings.py spikes/pyside6/qml_audio_batch.py
          spikes/pyside6/qml_clipboard.py spikes/pyside6/qml_voice_translation.py
          spikes/pyside6/qt_shell.py tests/test_pyside6_qml.py tests/test_pyside6_qml_runtime.py
          tests/test_pyside6_qml_audio_batch.py tests/test_pyside6_qml_clipboard.py
          tests/test_pyside6_qml_voice_translation.py tests/test_pyside6_qt_shell.py

      - name: Run targeted type checks
        if: matrix.os == 'ubuntu-latest'
        run: mypy desktop_state.py windows_hotkeys.py

      - name: Audit dependencies
        run: python scripts/dependency_audit.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q spikes/pyside6/qml_app.py spikes/pyside6/qml_bridge.py
          spikes/pyside6/qml_runtime.py spikes/pyside6/qml_settings.py
          spikes/pyside6/qml_audio_batch.py spikes/pyside6/qml_clipboard.py
          spikes/pyside6/qml_voice_translation.py spikes/pyside6/qt_shell.py
          workflows.py desktop_state.py repositories.py workflow_config.py workflow_settings.py
          voice_translation.py
          secret_store.py update_security.py version.py windows_clipboard.py
          windows_hotkeys.py provider_types.py provider_adapters.py provider_http.py
          provider_registry.py scripts/create_release_manifest.py tests
          local_asr.py audio_file_batch.py audio_file_batch_ui.py history_store.py scripts/local_asr_harness.py

      - name: Validate QML assets
        run: >-
          python -c "from pathlib import Path; qml = Path('spikes/pyside6/qml');
          assert qml.is_dir() and (qml / 'Main.qml').is_file() and any(qml.glob('*.qml'))"

  package:
    name: Package Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-windows.txt

      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-windows.txt

      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-windows.txt

      - name: Install manifest dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build portable executable
        shell: pwsh
        run: |
          .\scripts\build.ps1
          .\scripts\build.ps1 `
            -OutputDirectory dist\baseline `
            -PayloadIdentity baseline-msi-0.1.1

          $baselinePayload = "dist\baseline\ClarifyVoice.exe"
          $currentPayload = "dist\ClarifyVoice.exe"
          $baselineHash = (Get-FileHash $baselinePayload -Algorithm SHA256).Hash
          $currentHash = (Get-FileHash $currentPayload -Algorithm SHA256).Hash
          if ($baselineHash -eq $currentHash) {
            throw "Baseline and current executable payloads must be byte-distinct."
          }

      - name: Build baseline and current installers
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -Version 0.1.1 `
            -SourceExe dist\baseline\ClarifyVoice.exe `
            -OutputPath dist\ClarifyVoice-windows-x64-baseline.msi
          .\scripts\build-installer.ps1 `
            -SourceExe dist\ClarifyVoice.exe `
            -OutputPath dist\ClarifyVoice-windows-x64.msi

      - name: Smoke-test packaged QML entrypoint
        shell: pwsh
        run: |
          $executable = (Resolve-Path .\dist\ClarifyVoice.exe).Path
          $smokeDataDirectory = Join-Path $env:RUNNER_TEMP "clarifyvoice-packaged-smoke"
          New-Item -Path $smokeDataDirectory -ItemType Directory -Force | Out-Null
          $previousDataDirectory = $env:CLARIFYVOICE_DATA_DIR
          $env:CLARIFYVOICE_DATA_DIR = $smokeDataDirectory
          try {
            $process = Start-Process -FilePath $executable `
              -ArgumentList @('--hidden') -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                throw "Packaged QML entrypoint exited during hidden launch (exit code $($process.ExitCode))."
              }
            } finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          } finally {
            if ($null -eq $previousDataDirectory) {
              Remove-Item Env:CLARIFYVOICE_DATA_DIR -ErrorAction SilentlyContinue
            } else {
              $env:CLARIFYVOICE_DATA_DIR = $previousDataDirectory
            }
          }

      - name: Validate secret-store contract
        run: >-
          python -c "import sys; sys.argv = ['app.py', 'secret-store-self-test']; import app; raise SystemExit(app._run_cli(['secret-store-self-test']))"

      - name: Test install, upgrade, repair, rollback, and uninstall
        shell: pwsh
        run: |
          .\scripts\test-installer.ps1 `
            -BaselineInstaller dist\ClarifyVoice-windows-x64-baseline.msi `
            -CurrentInstaller dist\ClarifyVoice-windows-x64.msi `
            -BaselinePayloadSha256 $((Get-FileHash dist\baseline\ClarifyVoice.exe -Algorithm SHA256).Hash) `
            -CurrentPayloadSha256 $((Get-FileHash dist\ClarifyVoice.exe -Algorithm SHA256).Hash)

      - name: Validate release manifest contract
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          python .\scripts\create_release_manifest.py `
            --version $version `
            --installer dist\ClarifyVoice-windows-x64.msi `
            --output dist\release-manifest.json
          .\scripts\build-manifest-container.ps1 `
            -Manifest dist\release-manifest.json `
            -OutputPath dist\ClarifyVoice-release-manifest.cab

      - name: Upload smoke-test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClarifyVoice-windows-${{ github.sha }}
          path: |
            dist/ClarifyVoice.exe
            dist/ClarifyVoice-windows-x64.msi
            dist/ClarifyVoice-release-manifest.cab
          if-no-files-found: error
          retention-days: 7
